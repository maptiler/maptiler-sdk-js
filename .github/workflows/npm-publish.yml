# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

permissions:
  id-token: write  # Required for NPM trusted publishing
  contents: read

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Clear NPM cache
        run: npm cache clean --force

      - name: Install dependencies and build
        run: npm ci

      - name: Make release
        run: npm run make
        id: makeRelease

      - name: Fail job if makeRelease failed
        if: steps.makeRelease.outcome == 'failure'
        run: exit 1

        id: check-build-status
      - name: Determine npm dist-tag
        id: npmtag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          derive_tag_from_version() {
            node -p "require('./package.json').version.split('-').slice(1).join('-').replace(/\.\d+$/, '') || '$1'"
          }

          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            # Explicit pre-release: tag from the version's prerelease identifier
            # (e.g. 5.0.0-markers-alpha.0 -> markers-alpha), so it doesn't land
            # on the shared "next" tag.
            TAG=$(derive_tag_from_version next)
          else
            # Not marked pre-release, but GitHub also lets you leave a release
            # unlabeled (neither "Set as the latest release" nor "pre-release").
            # The webhook payload has no field for that, so ask the API whether
            # this release is actually the current "latest" one.
            LATEST_ID=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .id 2>/dev/null || echo "")
            if [ "$LATEST_ID" = "${{ github.event.release.id }}" ]; then
              TAG=latest
            else
              TAG=$(derive_tag_from_version untagged)
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish NPM package
        run: npm publish --tag ${{ steps.npmtag.outputs.tag }}

      - name: Get Package version
        id: version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Publish to CDN Cloudflare R2
        uses: ryand56/r2-upload-action@v1.4
        with:
          r2-account-id: ${{ secrets.CDN_MAPTILER_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CDN_MAPTILER_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CDN_MAPTILER_SECRET_ACCESS_KEY }}
          r2-bucket: cdn-storage
          source-dir: build
          destination-dir: maptiler-sdk-js/v${{ env.PACKAGE_VERSION }}/
 
      - name: Dispatch e2e request to maptiler-sdk-e2e-testing
        continue-on-error: true # if the dispatch fails, we don't want to fail the job
        if: success()
        env:
          DISPATCH_E2E_WORKFLOW: e2e.yml
        run: |
          VERSION=$(jq -r .version package.json)
          PAYLOAD=$(jq -n \
            --arg ref "main" \
            --arg sdk_version "$VERSION" \
            --arg weather_version "latest" \
            --arg threed_version "latest" \
            --arg client_version "latest" \
            '{ ref: $ref, inputs: { sdk_version: $sdk_version, weather_version: $weather_version, "3d_version": $threed_version, client_version: $client_version } }')
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.E2E_DISPATCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/maptiler/maptiler-sdk-e2e-testing/actions/workflows/${DISPATCH_E2E_WORKFLOW}/dispatches"
