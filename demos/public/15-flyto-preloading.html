<!DOCTYPE html>
<html>

<head>
  <title>MapTiler SDK – flyTo Tile Preloading (Experimental)</title>
  <style>
    html, body { margin: 0; font-family: sans-serif; }

    #map {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: #ccc;
    }

    #panel {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 12px;
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      max-width: 260px;
    }

    #panel h3 {
      margin: 0 0 4px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #333;
    }

    #panel p {
      margin: 0 0 10px;
      font-size: 11px;
      color: #666;
      line-height: 1.4;
    }

    .destination-btn {
      display: block;
      width: 100%;
      margin-bottom: 6px;
      padding: 8px 12px;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }

    .destination-btn:hover { background: #eef4ff; border-color: #4a80d8; }
    .destination-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .destination-btn:active { background: #4a80d8; color: white; }

    #progress-bar-wrap {
      margin-top: 10px;
      background: #eee;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #4a80d8;
      transition: width 0.1s linear;
      border-radius: 4px;
    }

    #status {
      margin-top: 6px;
      font-size: 11px;
      color: #666;
      min-height: 16px;
    }

    #mode-toggle {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
  <link rel="stylesheet" href="../build/maptiler-sdk.css">
</head>

<body>
  <div id="map"></div>

  <div id="panel">
    <h3>flyTo Preloading (Experimental)</h3>
    <p>Tiles along the flight path are preloaded before the animation starts. Toggle to compare.</p>

    <button class="destination-btn" data-lng="-74.006" data-lat="40.7128" data-zoom="14">🗽 New York</button>
    <button class="destination-btn" data-lng="2.3522"  data-lat="48.8566" data-zoom="14">🗼 Paris</button>
    <button class="destination-btn" data-lng="139.6917" data-lat="35.6895" data-zoom="14">🗾 Tokyo</button>
    <button class="destination-btn" data-lng="-43.1729" data-lat="-22.9068" data-zoom="14">🌴 Rio</button>
    <button class="destination-btn" data-lng="151.2093" data-lat="-33.8688" data-zoom="14">🦘 Sydney</button>

    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="status">Select a destination.</div>

    <div id="mode-toggle">
      <input type="checkbox" id="preload-toggle" checked />
      <label for="preload-toggle">Use experimental_preload</label>
    </div>
    <div id="mode-toggle">
      <input type="checkbox" id="preprocess-toggle" />
      <label for="preprocess-toggle">Preprocess tiles after fetch</label>
    </div>
  </div>

  <script type="module" src="/src/15-flyto-preloading.ts"></script>
</body>


</html>
