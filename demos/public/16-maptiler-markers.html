<!DOCTYPE html>
<html>

<head>
  <title>MapTiler Markers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      width: 220px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctrl-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.45);
    }

    .size-row {
      display: flex;
      gap: 4px;
    }

    .size-btn {
      flex: 1;
      height: 28px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      background: transparent;
      font: 600 11px system-ui;
      color: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: all 0.1s;
    }

    .size-btn:hover {
      border-color: rgba(0, 0, 0, 0.25);
      color: rgba(0, 0, 0, 0.8);
    }

    .size-btn.active {
      background: hsl(223, 100%, 65%);
      border-color: hsl(223, 100%, 65%);
      color: #fff;
    }

    .shadow-row {
      display: flex;
      gap: 4px;
    }

    .shadow-btn {
      flex: 1;
      height: 28px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      background: transparent;
      font: 600 11px system-ui;
      color: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: all 0.1s;
    }

    .shadow-btn:hover {
      border-color: rgba(0, 0, 0, 0.25);
      color: rgba(0, 0, 0, 0.8);
    }

    .shadow-btn.active {
      background: hsl(223, 100%, 65%);
      border-color: hsl(223, 100%, 65%);
      color: #fff;
    }

    .scale-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scale-axis {
      font-size: 11px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.4);
      width: 10px;
      flex-shrink: 0;
    }

    .scale-row input[type="range"] {
      flex: 1;
      height: 4px;
      accent-color: hsl(223, 100%, 65%);
    }

    .scale-val {
      font-size: 11px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.6);
      width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-name {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.5);
      flex: 1;
    }

    .color-item input[type="color"] {
      flex-shrink: 0;
      width: 28px;
      height: 22px;
      padding: 1px 2px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .text-input {
      width: 100%;
      height: 28px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      padding: 0 8px;
      font: 500 12px system-ui;
      color: rgba(0, 0, 0, 0.8);
      outline: none;
    }

    .text-input:focus {
      border-color: hsl(223, 100%, 65%);
    }

    #status {
      font-size: 10px;
      color: rgba(0, 0, 0, 0.45);
      font-family: monospace;
      line-height: 1.4;
      word-break: break-all;
    }
  </style>

  <link rel="stylesheet" href="../build/maptiler-sdk.css">
</head>

<body>
  <div id="map"></div>

  <div id="panel">
    <div class="ctrl-group">
      <div class="ctrl-label">Size</div>
      <div class="size-row">
        <button class="size-btn" data-size="xs">xs</button>
        <button class="size-btn" data-size="s">s</button>
        <button class="size-btn" data-size="m">m</button>
        <button class="size-btn" data-size="L">L</button>
        <button class="size-btn" data-size="XL">XL</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Shadow</div>
      <div class="shadow-row">
        <button class="shadow-btn" data-shadow="">none</button>
        <button class="shadow-btn" data-shadow="soft">soft</button>
        <button class="shadow-btn" data-shadow="medium">medium</button>
        <button class="shadow-btn" data-shadow="strong">strong</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Colors</div>
      <div class="color-grid">
        <div class="color-item">
          <label class="color-name" for="outer-color">Outer</label>
          <input id="outer-color" type="color" />
        </div>
        <div class="color-item">
          <label class="color-name" for="inner-color">Inner</label>
          <input id="inner-color" type="color" />
        </div>
        <div class="color-item">
          <label class="color-name" for="content-color">Content</label>
          <input id="content-color" type="color" />
        </div>
        <div class="color-item">
          <label class="color-name" for="outline-color">Outline</label>
          <input id="outline-color" type="color" />
        </div>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Outline width</div>
      <div class="scale-row">
        <input id="outline-width" type="range" min="0" max="8" step="0.5" value="0" />
        <span class="scale-val" id="outline-width-val">off</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Title</div>
      <input id="title-input" class="text-input" type="text" value="1" />
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Rotation</div>
      <div class="scale-row">
        <input id="rotation" type="range" min="-180" max="180" step="1" value="0" />
        <span class="scale-val" id="rotation-val">0°</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Scale</div>
      <div class="scale-row">
        <span class="scale-axis">X</span>
        <input id="scale-x" type="range" min="0.25" max="3" step="0.05" value="1" />
        <span class="scale-val" id="scale-x-val">1.00</span>
      </div>
      <div class="scale-row">
        <span class="scale-axis">Y</span>
        <input id="scale-y" type="range" min="0.25" max="3" step="0.05" value="1" />
        <span class="scale-val" id="scale-y-val">1.00</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">Getters</div>
      <div id="status"></div>
    </div>
  </div>

  <script type="module" src="/src/16-maptiler-markers.ts"></script>
</body>

</html>
